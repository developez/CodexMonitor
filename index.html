<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Codex Monitor</title>
<!--
  Codex Monitor: consumo de tokens de Codex por sesion y subagente.
  Todo se calcula aqui en el navegador. El servidor es estatico (python -m http.server)
  y "codex-sessions" es una union (junction) a C:\Users\<usuario>\.codex\sessions.
-->
<style>
  :root {
    color-scheme: dark;
    --bg: #0a0a0a; --panel: #141414; --text: #e6e1d9; --muted: #8a8580; --border: #2a2826;
    --accent: #7aa2f7; --c-main: #7aa2f7; --c-agent: #6fc3a0; --c-review: #c9a86a; --c-money: #5fd068;
    --c-input: #7f98b0; --c-output: #7aa2f7; --c-reason: #a78bda; --c-cwrite: #c9a86a; --c-cread: #5a5650;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 13px/1.5 ui-monospace, "Cascadia Code", "SF Mono", Consolas, Menlo, monospace; }
  header { padding: 14px 20px; border-bottom: 1px solid var(--border); background: var(--panel);
           display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: flex-end; }
  h1 { font-size: 15px; margin: 0 12px 4px 0; color: var(--accent); font-weight: 600; }
  h1::before { content: "❯ "; }
  label { color: var(--muted); font-size: 12px; display: flex; flex-direction: column; gap: 3px; }
  select, input[type=date] { font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--border);
           border-radius: 4px; padding: 6px 8px; max-width: 100%; }
  #session { min-width: min(640px, 90vw); }
  .check { flex-direction: row; align-items: center; gap: 6px; font-size: 13px; color: var(--text); padding-bottom: 6px; }
  button:hover, select:focus, input[type=date]:focus { border-color: var(--accent); outline: none; }
  input[type=checkbox] { accent-color: var(--accent); }
  button { font: inherit; padding: 6px 12px; border-radius: 4px; border: 1px solid var(--border);
           background: var(--bg); color: var(--text); cursor: pointer; }
  #status, #limits { color: var(--muted); font-size: 12px; padding-bottom: 8px; }
  #limits b { color: var(--text); font-weight: 600; }
  main { padding: 16px 20px 32px; display: grid; gap: 16px; }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 6px; padding: 14px 16px; }
  .meta { display: flex; flex-wrap: wrap; gap: 6px 22px; color: var(--muted); }
  .meta b { color: var(--text); font-weight: 600; }
  .chart-wrap { position: relative; height: 520px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { padding: 6px 8px; border-bottom: 1px solid var(--border); text-align: right; white-space: nowrap; }
  th:nth-child(-n+3), td:nth-child(-n+3) { text-align: left; }
  td.desc { white-space: normal; max-width: 420px; }
  th { color: var(--muted); font-weight: 600; }
  tr.main td { font-weight: 600; }
  .swatch { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 4px; }
  .empty { color: var(--muted); }
  .table-scroll { overflow-x: auto; }
  .tabs { display: flex; gap: 4px; padding: 12px 20px 0; border-bottom: 1px solid var(--border); }
  .tabs button { border: 1px solid var(--border); border-bottom: none; border-radius: 6px 6px 0 0;
                 background: var(--bg); color: var(--muted); padding: 7px 16px; margin-bottom: -1px; }
  .tabs button.active { background: var(--panel); color: var(--accent); border-color: var(--border); }
  .meta b.money, b.money { color: var(--c-money); }
  .tab { display: grid; gap: 16px; }
  .tab[hidden] { display: none; }
  .toolbar { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin-bottom: 10px; color: var(--muted); }
  .toolbar select, .toolbar input[type=date] { padding: 4px 8px; }
  .day-night-controls { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px;
                        margin-bottom: 12px; color: var(--muted); font-size: 12px; }
  .day-night-controls .check { padding-bottom: 0; }
  .day-night-toggle { appearance: none; position: relative; flex: 0 0 auto; width: 36px; height: 20px;
                      margin: 0; border: 1px solid var(--border); border-radius: 12px;
                      background: var(--bg); cursor: pointer; transition: background .15s; }
  .day-night-toggle::before { content: ''; position: absolute; left: 2px; top: 2px; width: 14px; height: 14px;
                              border-radius: 50%; background: var(--muted); transition: transform .15s; }
  .day-night-toggle:checked { background: #254c70; border-color: #608fba; }
  .day-night-toggle:checked::before { transform: translateX(16px); background: #d9ecff; }
  .day-night-toggle:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  .day-night-toggle:disabled { opacity: .45; cursor: not-allowed; }
  .day-night-legend { display: inline-flex; flex-wrap: wrap; gap: 8px; }
  .day-night-legend[hidden] { display: none; }
  .day-night-legend span { padding: 2px 8px; border-radius: 4px; }
  .band-day { color: #c5e5ff; background: rgba(73, 155, 222, .18); }
  .band-night { color: #c0c9f4; background: rgba(62, 72, 135, .26); }
</style>
</head>
<body>
<header>
  <h1>Codex Monitor</h1>
  <label>Proyecto
    <select id="project"><option value="">Todos</option></select>
  </label>
  <label>Sesión
    <select id="session"></select>
  </label>
  <label class="check"><input type="checkbox" id="hideCacheRead"> Ocultar lectura de caché</label>
  <button id="reload" title="Volver a leer los transcripts">Recargar</button>
  <span id="status"></span>
  <span id="limits"></span>
</header>
<nav class="tabs">
  <button class="active" data-tab="session">Sesión</button>
  <button data-tab="days">En el tiempo</button>
</nav>
<main>
  <section class="tab" id="tab-session">
    <div class="card meta" id="meta"><span class="empty">Cargando sesiones…</span></div>
    <div class="card"><div class="chart-wrap"><canvas id="chart"></canvas></div></div>
    <div class="card table-scroll" id="detail"></div>
  </section>
  <section class="tab" id="tab-days" hidden>
    <div class="card meta" id="daysMeta"><span class="empty">Sin datos todavía…</span></div>
    <div class="card">
      <div class="toolbar">
        <label for="dateFrom">Desde
          <input type="date" id="dateFrom">
        </label>
        <label for="dateTo">Hasta
          <input type="date" id="dateTo">
        </label>
        <label for="granularity">Granularidad
          <select id="granularity">
            <option value="24">Diaria</option><option value="1">1 hora</option>
            <option value="3">3 horas</option><option value="8">8 horas</option><option value="12">12 horas</option>
          </select>
        </label>
        Agrupar por
        <select id="groupBy"><option value="type">Tipo de token</option><option value="model">Modelo</option></select>
        Eje
        <select id="metric"><option value="tokens">Tokens</option><option value="cost">Coste (€)</option></select>
        <span>(respeta el filtro de Proyecto; usa todas las sesiones, no solo la seleccionada)</span>
      </div>
      <div class="day-night-controls">
        <label class="check"><input type="checkbox" role="switch" id="showDayNight" class="day-night-toggle"
          aria-describedby="dayNightHint"> Franjas día / noche</label>
        <span id="dayNightHint">Disponible en vistas por horas</span>
        <span id="dayNightLegend" class="day-night-legend" hidden>
          <span class="band-day">☀ Día 08:00–20:00</span>
          <span class="band-night">☾ ✦ Noche 20:00–08:00</span>
        </span>
      </div>
      <div class="chart-wrap"><canvas id="dayChart"></canvas></div>
    </div>
  </section>
  <section class="card table-scroll" id="prices"></section>
</main>

<script src="vendor/chart.umd.min.js"></script>
<script>
// ---------- Configuracion ----------
const DATA = 'codex-sessions/';                  // junction a ~/.codex/sessions (AAAA/MM/DD/rollout-*.jsonl)
// Valores por defecto; se sobrescriben con config.json (ver loadConfig)
let PROJECT_PREFIXES = ['*'];                      // carpetas de trabajo (cwd) incluidas ('*' = todas)
let PROJECT_NAMES = {};                            // carpeta de trabajo -> nombre a mostrar

// Codex guarda la carpeta de trabajo (cwd) de cada sesion; se compara normalizada
const normPath = p => String(p || '').trim().replace(/\\/g, '/').replace(/\/+$/, '').toLowerCase();

// La carpeta indicada o cualquiera de sus subcarpetas
const includedProject = key => PROJECT_PREFIXES.some(p => p === '*' || key === p || key.startsWith(p + '/'));

async function loadConfig() {
  try {
    const cfg = await (await fetch('config.json', { cache: 'no-store' })).json();
    if (Array.isArray(cfg.folders) && cfg.folders.length)
      PROJECT_PREFIXES = cfg.folders.map(f => (f === '*' ? '*' : normPath(f)));
    if (cfg.names && typeof cfg.names === 'object')
      PROJECT_NAMES = Object.fromEntries(Object.entries(cfg.names).map(([k, v]) => [normPath(k), v]));
  } catch { /* sin config.json o JSON invalido: valores por defecto */ }
}
// Version y zona local: fuerza relectura tras actualizar o cambiar de zona horaria.
const CACHE_PREFIX = `cx2:${Intl.DateTimeFormat().resolvedOptions().timeZone}:`;

// ---------- Tarifas (datos fijos) ----------
// USD por millon de tokens, nivel Standard. Fuente: https://developers.openai.com/api/docs/pricing
// (consultada el 2026-11-19). Orden: entrada, escritura cache (30 min), lectura cache, salida.
// El razonamiento se cobra como salida. '#long': peticiones de mas de 272.000 tokens de entrada.
// Donde la pagina no da precio de escritura de cache se usa el de entrada.
// Para actualizarlas basta con editar esta tabla: el coste se calcula al vuelo, no se guarda en cache.
const P = (i, w, read, out) => ({ in: i, w, read, out });
const LONG_PROMPT = 272000;
const PRICES = {
  'gpt-6.2-astra': P(8, 10, 0.40, 40),        'gpt-6.2-astra#long': P(16, 20, 0.80, 60),
  'gpt-6.2-sol':   P(2, 2.5, 0.10, 10),       'gpt-6.2-sol#long':   P(4, 5, 0.20, 15),
  'gpt-6.1-sol':   P(2, 2.5, 0.10, 10),       'gpt-6.1-sol#long':   P(4, 5, 0.20, 15),
  'gpt-6.1-terra': P(1, 1.25, 0.05, 5),       'gpt-6.1-terra#long': P(2, 2.5, 0.10, 7.5),
  'gpt-6-astra':   P(10, 12.5, 1, 50),        'gpt-6-astra#long':   P(20, 25, 2, 75),
  'gpt-6-sol':     P(2, 2.5, 0.20, 10),       'gpt-6-sol#long':     P(4, 5, 0.40, 15),
  'gpt-6-luna':    P(0.10, 0.125, 0.01, 0.50), 'gpt-6-luna#long':   P(0.20, 0.25, 0.02, 0.75),
  'gpt-5.6-sol':   P(4, 5, 0.40, 20),         'gpt-5.6-sol#long':   P(8, 10, 0.80, 30),
  'gpt-5.6-terra': P(2, 2.5, 0.20, 12),       'gpt-5.6-terra#long': P(4, 5, 0.40, 18),
  'gpt-5.6-luna':  P(0.20, 0.25, 0.02, 1.20), 'gpt-5.6-luna#long':  P(0.40, 0.50, 0.04, 1.80),
  'gpt-5.5':       P(5, 5, 0.50, 30),         'gpt-5.5#long':       P(10, 10, 1, 45),
  'gpt-5.4':       P(2.5, 2.5, 0.25, 15),     'gpt-5.4#long':       P(5, 5, 0.50, 22.5),
  'gpt-5.4-mini':  P(0.75, 0.75, 0.075, 4.50),
  'gpt-5.4-nano':  P(0.20, 0.20, 0.02, 1.25),
  'gpt-5.3-codex': P(1.75, 1.75, 0.175, 14),
  'gpt-5.2':       P(1.75, 1.75, 0.175, 14),
  'gpt-5.1':       P(1.25, 1.25, 0.125, 10),
  'gpt-5':         P(1.25, 1.25, 0.125, 10),
  'gpt-5-mini':    P(0.25, 0.25, 0.025, 2),
  'gpt-5-nano':    P(0.05, 0.05, 0.005, 0.40),
};
const USD_PER_EUR = 1.0992;                      // tipo de referencia BCE del 2026-11-19

// Codex informa input_tokens con la cache incluida y output_tokens con el razonamiento incluido;
// aqui se separan para que las partes sumen el total sin solaparse.
const TOKEN_KEYS = ['input_tokens', 'output_tokens', 'reasoning_tokens', 'cache_creation_input_tokens', 'cache_read_input_tokens'];
const USAGE_KEYS = TOKEN_KEYS;
const TYPES = [
  { key: 'input_tokens', label: 'Entrada', color: '--c-input' },
  { key: 'output_tokens', label: 'Salida', color: '--c-output' },
  { key: 'reasoning_tokens', label: 'Razonamiento', color: '--c-reason' },
  { key: 'cache_creation_input_tokens', label: 'Escritura caché', color: '--c-cwrite' },
  { key: 'cache_read_input_tokens', label: 'Lectura caché', color: '--c-cread' },
];

// ---------- Utilidades ----------
const $ = id => document.getElementById(id);
const fmt = n => (n || 0).toLocaleString('es-ES');
const short = n => n >= 1e6 ? (n / 1e6).toFixed(1).replace('.', ',') + ' M'
                 : n >= 1e3 ? Math.round(n / 1e3) + ' k' : String(n || 0);
const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const fmtDate = s => s ? new Date(s).toLocaleString('es-ES', { dateStyle: 'short', timeStyle: 'short' }) : '';
const trunc = (s, n) => s && s.length > n ? s.slice(0, n - 1) + '…' : (s || '');
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const prettyProject = s => PROJECT_NAMES[s.project] || (s.cwd ? s.cwd.replace(/[\\/]+$/, '').split(/[\\/]/).pop() : '(sin carpeta)');
const emptyUsage = () => Object.fromEntries(USAGE_KEYS.map(k => [k, 0]));

// Uso de una respuesta de Codex -> partes sin solape (mismas claves que TOKEN_KEYS)
function splitUsage(u) {
  const inp = +u.input_tokens || 0, read = +u.cached_input_tokens || 0, write = +u.cache_write_input_tokens || 0;
  const out = +u.output_tokens || 0, reason = Math.min(+u.reasoning_output_tokens || 0, out);
  return { input_tokens: Math.max(0, inp - read - write), output_tokens: out - reason, reasoning_tokens: reason,
           cache_creation_input_tokens: write, cache_read_input_tokens: read, prompt: inp };
}

// ---------- Costes ----------
const baseModel = k => k.split('#')[0];                    // 'x#long' -> 'x'
const cleanModel = m => String(m).replace(/^openai\//, '').replace(/-\d{4}-\d{2}-\d{2}$/, '');
const priceKey = (model, prompt) => {                      // tarifa larga por encima de 272k de entrada
  const m = cleanModel(model);
  return prompt > LONG_PROMPT && PRICES[m + '#long'] ? m + '#long' : m;
};
const officialPrice = key => PRICES[cleanModel(baseModel(key)) + (key.includes('#') ? '#' + key.split('#')[1] : '')]
                     || PRICES[cleanModel(baseModel(key))];
// Modelos sin tarifa publicada (p. ej. codex-auto-review): se usa una tarifa estimada, el promedio
// de las tarifas normales de los modelos con precio que aparecen en los datos (ver computeEstimate)
let ESTIMATE = null;
const isEstimated = key => !officialPrice(key);
const priceFor = key => officialPrice(key) || ESTIMATE;
function computeEstimate(modelKeys) {
  const shortKeys = k => !k.includes('#');
  let base = [...new Set(modelKeys.map(k => cleanModel(baseModel(k))))].filter(k => PRICES[k]);
  if (!base.length) base = Object.keys(PRICES).filter(shortKeys);
  const avg = f => base.reduce((a, k) => a + PRICES[k][f], 0) / base.length;
  ESTIMATE = { ...P(avg('in'), avg('w'), avg('read'), avg('out')), from: base };
}
// Coste en USD por tipo de token (mismas claves que TOKEN_KEYS); null si el modelo no tiene tarifa
function costParts(key, u) {
  const p = priceFor(key);
  if (!p) return null;
  return {
    input_tokens: (u.input_tokens || 0) * p.in / 1e6,
    output_tokens: (u.output_tokens || 0) * p.out / 1e6,
    reasoning_tokens: (u.reasoning_tokens || 0) * p.out / 1e6,
    cache_creation_input_tokens: (u.cache_creation_input_tokens || 0) * p.w / 1e6,
    cache_read_input_tokens: (u.cache_read_input_tokens || 0) * p.read / 1e6,
  };
}
// Coste en USD de un conjunto de modelos {modelo: uso}, solo con los tipos indicados
const costOf = (models, keys = TOKEN_KEYS) => Object.entries(models || {}).reduce((a, [mo, u]) => {
  const c = costParts(mo, u);
  return c ? a + keys.reduce((s, k) => s + c[k], 0) : a;
}, 0);
const costOfDays = days => Object.values(days || {}).reduce((a, models) => a + costOf(models), 0);
const unpricedModels = models => [...new Set(Object.keys(models || {}).filter(isEstimated).map(baseModel))];
const estimatedNote = list => list.length
  ? `<span>Tarifa estimada (promedio, ver tabla de precios): <b>${esc(list.join(', '))}</b></span>` : '';
const fmtEur = e => e.toLocaleString('es-ES', { style: 'currency', currency: 'EUR',
                      minimumFractionDigits: e < 10 ? 2 : 0, maximumFractionDigits: e < 10 ? 2 : 0 });
const money = usd => fmtEur(usd / USD_PER_EUR);
const pad2 = n => String(n).padStart(2, '0');
const dayKey = ts => { const d = new Date(ts); return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`; };
const hourKey = ts => `${dayKey(ts)}T${pad2(new Date(ts).getHours())}`;

function setDefaultDateRange(now = new Date()) {
  const from = new Date(now);
  from.setDate(from.getDate() - 2);
  $('dateFrom').value = dayKey(from);
  $('dateTo').value = dayKey(now);
}

// Suma src (periodo -> modelo -> uso) dentro de target (dias, horas o tramos)
function mergeDays(target, src) {
  for (const [day, models] of Object.entries(src || {}))
    for (const [model, u] of Object.entries(models)) {
      const t = (target[day] ||= {})[model] ||= emptyUsage();
      for (const k of USAGE_KEYS) t[k] += u[k] || 0;
    }
}

function groupHours(hours, span) {
  const blocks = {};
  for (const [hour, models] of Object.entries(hours || {})) {
    const key = `${hour.slice(0, 10)}T${pad2(Math.floor(+hour.slice(11) / span) * span)}`;
    mergeDays(blocks, { [key]: models });
  }
  return blocks;
}

function timeRange(keys, span) {
  if (!keys.length) return [];
  const range = [], first = keys[0], last = keys[keys.length - 1];
  const [y, m, d0] = first.slice(0, 10).split('-').map(Number);
  // Avanzar por dias de calendario mantiene los tramos alineados incluso al cambiar la hora.
  for (let d = new Date(y, m - 1, d0); dayKey(d) <= last.slice(0, 10); d.setDate(d.getDate() + 1)) {
    for (let h = 0; h < 24; h += span) {
      const key = dayKey(d) + (span === 24 ? '' : `T${pad2(h)}`);
      if (key >= first && key <= last) {
        if (range.length >= 10000) return null; // evita crear cientos de miles de barras
        range.push(key);
      }
    }
  }
  return range;
}

function dayNightSegments(range, span) {
  const segments = [];
  range.forEach((key, i) => {
    const firstHour = +key.slice(11), lastHour = firstHour + span;
    for (let h = firstHour; h < lastHour;) {
      const day = h >= 8 && h < 20;
      const endHour = Math.min(lastHour, h < 8 ? 8 : h < 20 ? 20 : 24);
      const start = i + (h - firstHour) / span, end = i + (endHour - firstHour) / span;
      const prev = segments[segments.length - 1];
      if (prev && prev.day === day && prev.end === start) prev.end = end;
      else segments.push({ start, end, day });
      h = endHour;
    }
  });
  return segments;
}

function clearLegacyCache() {
  try {
    for (let i = localStorage.length - 1; i >= 0; i--) {
      const key = localStorage.key(i);
      if (key?.startsWith('cx1:') || (key?.startsWith('cx2:') && !key.startsWith(CACHE_PREFIX)))
        localStorage.removeItem(key);
    }
  } catch { /* almacenamiento no disponible */ }
}

function cacheGet(key) {
  try { return JSON.parse(localStorage.getItem(CACHE_PREFIX + key)); } catch { return null; }
}
function cacheSet(key, val) {
  try { localStorage.setItem(CACHE_PREFIX + key, JSON.stringify(val)); } catch { /* sin cache */ }
}

// Listado de directorio de python http.server -> [{name, dir}]
async function listDir(url) {
  const res = await fetch(url, { cache: 'no-store' });
  if (!res.ok) return [];
  const doc = new DOMParser().parseFromString(await res.text(), 'text/html');
  return [...doc.querySelectorAll('li > a')].map(a => {
    const href = decodeURIComponent(a.getAttribute('href'));
    return { name: href.replace(/\/$/, ''), dir: href.endsWith('/') };
  });
}

async function headInfo(url) {
  const res = await fetch(url, { method: 'HEAD', cache: 'no-store' });
  return { mtime: res.headers.get('Last-Modified') || '', size: res.headers.get('Content-Length') || '' };
}

// Texto escrito por el usuario dentro de un mensaje de Codex, o '' si es contexto inyectado
// (AGENTS.md, entorno, IDE...). Con contexto del IDE la peticion va tras "## My request...:".
const cleanText = s => s.replace(/&#x([0-9a-f]+);/gi, (_, h) => String.fromCodePoint(parseInt(h, 16)))
  .replace(/&#(\d+);/g, (_, d) => String.fromCodePoint(+d)).replace(/&amp;/g, '&')
  .replace(/<\/?[a-z_]+>/g, ' ').replace(/\s+/g, ' ').trim();
function promptOf(text) {
  const t = String(text || '');
  const req = t.match(/## My request[^\n]*:\s*\n([\s\S]*)/);
  const asked = req ? cleanText(req[1]) : '';
  if (asked) return asked;
  const pasted = t.match(/^\s*# Files pasted by the user:\s*([\s\S]*?)(## My request|$)/);
  if (pasted) return cleanText(pasted[1].replace(/^[#\s"]+/, ''));
  if (req) return '';
  return /^\s*(#|<|>>>)/.test(t) ? '' : cleanText(t);
}

// Lee un rollout .jsonl en streaming y resume tokens por modelo.
// Solo cuentan los token_usage_record del propio hilo: los subagentes "fork" copian el historial
// del padre (incluidos sus registros y token_count) y sumarlos contaria dos veces.
async function parseTranscript(url) {
  const res = await fetch(url, { cache: 'no-store' });
  if (!res.ok) throw new Error(`${res.status} ${url}`);
  const reqs = new Map();
  let meta = null, model = '?', firstPrompt = null, end = null, rate = null;

  const onLine = line => {
    const want = (!meta && line.includes('"type":"session_meta"'))
      || line.includes('"type":"token_usage_record"')
      || line.includes('"type":"turn_context"') || line.includes('"thread_settings_applied"')
      || (line.includes('"type":"token_count"') && line.includes('"rate_limits"'))
      || (firstPrompt === null && line.includes('"role":"user"'));
    if (!want) return;
    let o; try { o = JSON.parse(line); } catch { return; }
    const p = o.payload || {};
    if (o.type === 'session_meta') {
      if (meta) return;
      const spawn = p.source?.subagent?.thread_spawn;
      meta = {
        id: p.id, sessionId: p.session_id || p.id,
        parent: p.parent_thread_id || spawn?.parent_thread_id || null,
        kind: p.thread_source || (p.source?.subagent ? 'subagent' : 'user'),
        cwd: p.cwd || '', nickname: p.agent_nickname || spawn?.agent_nickname || '',
        agentPath: p.agent_path || spawn?.agent_path || '', role: spawn?.agent_role || '',
        depth: spawn?.depth || 1, forkedFrom: p.forked_from_id || null, start: p.timestamp || o.timestamp,
      };
    } else if (o.type === 'turn_context') {
      if (p.model) model = p.model;
    } else if (p.type === 'thread_settings_applied') {
      if (p.thread_settings?.model) model = p.thread_settings.model;
    } else if (o.type === 'token_usage_record') {
      if (!meta || p.thread_id !== meta.id || !p.usage) return;
      reqs.set(p.response_id || `#${reqs.size}`, [model, p.usage, o.timestamp]); // la ultima linea manda
      if (o.timestamp && (!end || o.timestamp > end)) end = o.timestamp;
    } else if (p.type === 'token_count') {
      if (p.rate_limits && o.timestamp && (!rate || o.timestamp > rate.ts))
        rate = { ts: o.timestamp, primary: p.rate_limits.primary || null, secondary: p.rate_limits.secondary || null };
    } else if (o.type === 'response_item' && p.type === 'message' && p.role === 'user' && firstPrompt === null) {
      for (const c of p.content || []) {
        const t = promptOf(c.text);
        if (t) { firstPrompt = t.slice(0, 300); break; }
      }
    }
  };

  const reader = res.body.pipeThrough(new TextDecoderStream()).getReader();
  let buf = '';
  for (;;) {
    const { value, done } = await reader.read();
    if (done) break;
    buf += value;
    const parts = buf.split('\n');
    buf = parts.pop();
    parts.forEach(onLine);
  }
  if (buf) onLine(buf);

  const tokens = emptyUsage(), models = {}, days = {}, hours = {};
  for (const [model0, raw, ts] of reqs.values()) {
    const u = splitUsage(raw);
    const mk = priceKey(model0, u.prompt);
    const m = models[mk] ||= emptyUsage();
    const d = ts ? ((days[dayKey(ts)] ||= {})[mk] ||= emptyUsage()) : null;
    const h = ts ? ((hours[hourKey(ts)] ||= {})[mk] ||= emptyUsage()) : null;
    for (const k of USAGE_KEYS) { tokens[k] += u[k]; m[k] += u[k]; if (d) d[k] += u[k]; if (h) h[k] += u[k]; }
  }
  return { meta, tokens, models, days, hours, total: TOKEN_KEYS.reduce((a, k) => a + tokens[k], 0),
           requests: reqs.size, firstPrompt: firstPrompt || '', start: meta?.start || null, end, rate };
}

// Resumen con cache: solo se vuelve a leer si cambia fecha o tamano del fichero
async function summary(path, info) {
  const hit = cacheGet(path);
  if (hit && hit.mtime === info.mtime && hit.size === info.size) return hit.data;
  const data = await parseTranscript(path);
  cacheSet(path, { ...info, data });
  return data;
}

// ---------- Modelo de sesiones ----------
let sessions = [];      // {project, cwd, id, path, mtime, title, main, agents, total, days}

// Recorre AAAA/MM/DD/ y devuelve los rollout-*.jsonl
async function listFiles() {
  const out = [];
  const walk = async (url, depth) => {
    for (const e of await listDir(url)) {
      if (e.dir && depth < 3) await walk(`${url}${encodeURIComponent(e.name)}/`, depth + 1);
      else if (!e.dir && /^rollout-.*\.jsonl$/.test(e.name)) out.push({ name: e.name, path: url + encodeURIComponent(e.name) });
    }
  };
  await walk(DATA, 0);
  return out;
}

async function pool(items, n, fn) {
  let i = 0;
  await Promise.all(Array.from({ length: Math.min(n, items.length) }, async () => {
    while (i < items.length) { const it = items[i++]; try { await fn(it); } catch { /* sigue */ } }
  }));
}

const isChild = m => m.kind !== 'user' && (m.parent || m.sessionId !== m.id);

function agentInfo(d) {
  const m = d.meta;
  if (m.kind === 'guardian_review')
    return { description: 'Revisión automática de acciones', agentType: 'revisión', review: true };
  const name = (m.agentPath || '').split('/').filter(Boolean).pop() || '';
  const description = [name, m.nickname].filter(Boolean).join(' · ') || trunc(d.firstPrompt, 60) || m.id;
  return { description, agentType: m.role || 'subagente' };
}

// Agrupa los ficheros en sesiones: cada hilo de usuario con sus subagentes y revisiones
function buildSessions(files) {
  const byId = new Map();
  files.forEach(f => { if (f.data?.meta?.id) byId.set(f.data.meta.id, f); });
  const rootOf = f => {
    const seen = new Set();
    let cur = f;
    while (isChild(cur.data.meta) && !seen.has(cur)) {
      seen.add(cur);
      const m = cur.data.meta;
      const up = [m.sessionId, m.parent].map(id => byId.get(id)).find(x => x && x !== cur);
      if (!up) break;
      cur = up;
    }
    return cur;
  };
  const groups = new Map();
  for (const f of byId.values()) {
    const r = rootOf(f);
    const g = groups.get(r) || { root: r, kids: [] };
    if (f !== r) g.kids.push(f);
    groups.set(r, g);
  }
  const list = [];
  for (const { root, kids } of groups.values()) {
    const m = root.data.meta;
    const key = normPath(m.cwd);
    if (!includedProject(key)) continue;
    const agents = kids.map(k => ({ ...k.data, ...agentInfo(k.data), depth: k.data.meta.depth || 1 }))
      .sort((a, b) => (a.start || '').localeCompare(b.start || ''));
    const days = {}, hours = {};
    mergeDays(days, root.data.days);
    mergeDays(hours, root.data.hours);
    agents.forEach(a => { mergeDays(days, a.days); mergeDays(hours, a.hours); });
    const mtime = [root, ...kids].map(f => f.mtime).sort((a, b) => new Date(b) - new Date(a))[0];
    const title = (m.forkedFrom ? '⑂ ' : '') + (trunc(root.data.firstPrompt, 80) || m.id);
    list.push({ project: key, cwd: m.cwd, id: m.id, path: root.path, mtime, title, main: root.data, agents,
                total: root.data.total + agents.reduce((a, x) => a + x.total, 0), days, hours });
  }
  return list.sort((a, b) => new Date(b.mtime) - new Date(a.mtime));
}

function optionLabel(s, showProject) {
  const proj = showProject ? ` · ${prettyProject(s)}` : '';
  const n = s.agents.length;
  const ag = n ? ` · ${n} agente${n > 1 ? 's' : ''}` : '';
  return `${fmtDate(s.mtime)}${proj} · ${trunc(s.title, 70)}${ag} · ${short(s.total)} · ${money(costOfDays(s.days))}`;
}

function fillProjects() {
  const sel = $('project'), keep = sel.value;
  const projects = [...new Map(sessions.map(s => [s.project, s])).values()]
    .sort((a, b) => prettyProject(a).localeCompare(prettyProject(b)));
  sel.innerHTML = '<option value="">Todos</option>' +
    projects.map(s => `<option value="${esc(s.project)}">${esc(prettyProject(s))}</option>`).join('');
  sel.value = projects.some(s => s.project === keep) ? keep : '';
}

function fillSessions(keep) {
  const p = $('project').value;
  const list = sessions.filter(s => p === '' || s.project === p);
  $('session').innerHTML = list.map(s =>
    `<option value="${esc(s.path)}">${esc(optionLabel(s, p === ''))}</option>`).join('');
  if (!list.length) { $('meta').innerHTML = '<span class="empty">No hay sesiones.</span>'; current = null; return; }
  if (keep && list.some(s => s.path === keep)) $('session').value = keep;
  showSession();
}

function showSession() {
  const s = sessions.find(x => x.path === $('session').value);
  if (!s) return;
  current = { s, main: s.main, agents: s.agents };
  render();
}

// Limites de uso de la cuenta (ventana corta y semanal) segun el ultimo token_count leido
function renderLimits() {
  const r = latestRate;
  if (!r || (!r.primary && !r.secondary)) { $('limits').textContent = ''; return; }
  const win = m => !m ? '' : m < 1440 ? `${Math.round(m / 60)} h` : `${Math.round(m / 1440)} d`;
  const part = l => {
    if (!l) return '';
    const reset = l.resets_at ? new Date(l.resets_at * 1000) : null;
    const gone = reset && reset < new Date();
    return `<span>Límite ${esc(win(l.window_minutes))}: <b>${gone ? '—' : Math.round(l.used_percent) + ' %'}</b>` +
      (reset ? ` (${gone ? 'renovado' : 'renueva ' + esc(fmtDate(reset))})` : '') + '</span>';
  };
  $('limits').innerHTML = [part(r.primary), part(r.secondary)].filter(Boolean).join(' · ') +
    ` · <span title="Dato del último token_count registrado">leído ${esc(fmtDate(r.ts))}</span>`;
}

async function init() {
  clearLegacyCache();
  const keep = $('session').value;
  $('status').textContent = 'Buscando sesiones…';
  await loadConfig();
  const files = await listFiles();
  let n = 0;
  await pool(files, 6, async f => {
    const info = await headInfo(f.path);
    f.mtime = info.mtime;
    f.data = await summary(f.path, info);
    $('status').textContent = `Leyendo transcripts ${++n}/${files.length}…`;
  });
  latestRate = files.map(f => f.data?.rate).filter(Boolean).sort((a, b) => b.ts.localeCompare(a.ts))[0] || null;
  sessions = buildSessions(files);
  computeEstimate(sessions.flatMap(s => Object.values(s.days).flatMap(Object.keys)));
  renderPrices();
  fillProjects();
  fillSessions(keep);
  renderLimits();
  renderDays();
  $('status').textContent = `${sessions.length} sesiones`;
}

function modelsText(models) {
  const by = {};

    by[baseModel(m)] = (by[baseModel(m)] || 0) + TOKEN_KEYS.reduce((a, k) => a + (u[k] || 0), 0);

}

// Etiqueta sobre cada barra: icono, tokens y debajo el coste en euros
// slot: ancho disponible (px). Si "11 M  12 €" no cabe en una linea, va en dos (tokens arriba, € abajo).
function drawBarLabel(ctx, x, yTop, tokens, eurText, icon, slot = Infinity) {
  const tokText = short(tokens), gap = 8;
  const wTok = ctx.measureText(tokText).width, wEur = ctx.measureText(eurText).width;
  let iconY = yTop - 28;
  if (slot < VERTICAL_SLOT) {                        // muy estrecho: texto en vertical, de abajo arriba
    ctx.save();
    ctx.translate(x + 4, yTop - 4);
    ctx.rotate(-Math.PI / 2);
    ctx.textAlign = 'left';
    ctx.fillStyle = css('--text');
    ctx.fillText(tokText, 0, 0);
    ctx.fillStyle = css('--c-money');
    ctx.fillText(eurText, wTok + gap, 0);
    ctx.restore();
    iconY = yTop - wTok - gap - wEur - 16;
  } else if (wTok + gap + wEur <= slot) {
    const left = x - (wTok + gap + wEur) / 2;        // grupo "11 M  12 €" centrado sobre la barra
    ctx.textAlign = 'left';
    ctx.fillStyle = css('--text');
    ctx.fillText(tokText, left, yTop - 6);
    ctx.fillStyle = css('--c-money');
    ctx.fillText(eurText, left + wTok + gap, yTop - 6);
  } else {
    ctx.textAlign = 'center';
    ctx.fillStyle = css('--text');
    ctx.fillText(tokText, x, yTop - 20);
    ctx.fillStyle = css('--c-money');
    ctx.fillText(eurText, x, yTop - 6);
    iconY = yTop - 42;
  }
  ctx.textAlign = 'center';
  if (icon) drawPrompt(ctx, x, iconY, 9, icon);
}

const VERTICAL_SLOT = 26;        // por debajo de este hueco por barra (px) la etiqueta va en vertical
const BAR_W = 64, SLOT_W = 96;   // ancho maximo de barra y de su hueco (px)

// Icono de terminal ">_"
function drawPrompt(ctx, x, y, r, color) {
  ctx.save();
  ctx.strokeStyle = color;
  ctx.lineWidth = 2.4;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.beginPath();
  ctx.moveTo(x - r, y - r * 0.7);
  ctx.lineTo(x - r * 0.25, y);
  ctx.lineTo(x - r, y + r * 0.7);
  ctx.moveTo(x + r * 0.1, y + r * 0.75);
  ctx.lineTo(x + r, y + r * 0.75);
  ctx.stroke();
  ctx.restore();
}

// ---------- Pestanas ----------
let tab = 'session', dayChart = null;
const MODEL_COLORS = ['#7aa2f7', '#c9a86a', '#6fc3a0', '#a78bda', '#d97757', '#d9708f', '#8aa84f', '#5fb3c9'];

function setTab(name) {
  tab = name;
  document.querySelectorAll('.tabs button').forEach(b => b.classList.toggle('active', b.dataset.tab === name));
  $('tab-session').hidden = name !== 'session';
  $('tab-days').hidden = name !== 'days';
  render();
  renderDays();
}

function renderDays() {
  if (tab !== 'days') return;
  const p = $('project').value, hide = $('hideCacheRead').checked, byModel = $('groupBy').value === 'model';
  const types = TYPES.filter(t => !(hide && t.key === 'cache_read_input_tokens'));
  const scope = sessions.filter(s => p === '' || s.project === p);
  const selectedSpan = +$('granularity').value;
  const span = [1, 3, 8, 12].includes(selectedSpan) ? selectedSpan : 24;
  const daily = span === 24;
  const showBands = !daily && $('showDayNight').checked;
  $('showDayNight').disabled = daily;
  $('dayNightLegend').hidden = !showBands;
  $('dayNightHint').textContent = daily ? 'Disponible en vistas por horas' : 'Hora local · día 08–20, noche 20–08';
  const from = $('dateFrom').value, to = $('dateTo').value;
  if (from && to && from > to) {
    $('daysMeta').innerHTML = '<span class="empty">La fecha Desde debe ser anterior o igual a Hasta.</span>';
    if (dayChart) { dayChart.destroy(); dayChart = null; }
    return;
  }
  const inDateRange = key => (!from || key.slice(0, 10) >= from) && (!to || key.slice(0, 10) <= to);
  const days = {};
  let matchedSessions = 0;
  scope.forEach(s => {
    const filtered = Object.fromEntries(Object.entries((daily ? s.days : s.hours) || {}).filter(([key]) => inDateRange(key)));
    if (Object.keys(filtered).length) matchedSessions++;
    mergeDays(days, daily ? filtered : groupHours(filtered, span));
  });
  const keys = Object.keys(days).sort();
  if (!keys.length) {
    $('daysMeta').innerHTML = '<span class="empty">Sin datos en el periodo seleccionado.</span>';
    if (dayChart) { dayChart.destroy(); dayChart = null; }
    return;
  }

  // Todos los dias o tramos del rango (los vacios cuentan como 0)
  const first = from ? from + (daily ? '' : 'T00') : keys[0];
  const last = to ? to + (daily ? '' : `T${pad2(24 - span)}`) : keys[keys.length - 1];
  const range = timeRange([first, last], span);
  if (!range) {
    $('daysMeta').innerHTML = '<span class="empty">Demasiados tramos. Reduce el rango de fechas o elige una granularidad mayor.</span>';
    if (dayChart) { dayChart.destroy(); dayChart = null; }
    return;
  }
  const blockTime = key => `${key.slice(11)}:00–${pad2(+key.slice(11) + span)}:00`;
  const periodLabel = key => daily ? key : `${key.slice(0, 10)} ${blockTime(key)}`;

  // Valores por modelo/uso: tokens, o coste en euros segun la metrica elegida
  const asCost = $('metric').value === 'cost';
  const entries = day => Object.entries(days[day] || {});
  const tokOf = (mo, u) => types.reduce((a, t) => a + (u[t.key] || 0), 0);
  const eurOf = (mo, u) => { const c = costParts(mo, u); return c ? types.reduce((a, t) => a + c[t.key], 0) / USD_PER_EUR : 0; };
  const valT = (mo, u, t) => asCost ? (costParts(mo, u)?.[t.key] || 0) / USD_PER_EUR : (u[t.key] || 0);
  const sumU = asCost ? eurOf : tokOf;
  const tokTotals = range.map(day => entries(day).reduce((a, [mo, u]) => a + tokOf(mo, u), 0));
  const eurTotals = range.map(day => entries(day).reduce((a, [mo, u]) => a + eurOf(mo, u), 0));
  const totals = asCost ? eurTotals : tokTotals;
  const fmtV = asCost ? fmtEur : fmt;
  const axisV = asCost ? v => fmtEur(v) : short;

  let datasets;
  if (byModel) {
    const tm = {};
    range.forEach(day => entries(day).forEach(([mo, u]) => { tm[baseModel(mo)] = (tm[baseModel(mo)] || 0) + sumU(mo, u); }));
    datasets = Object.keys(tm).sort((a, b) => tm[b] - tm[a]).map((bm, i) => ({
      label: bm, backgroundColor: MODEL_COLORS[i % MODEL_COLORS.length],
      data: range.map(day => entries(day).filter(([mo]) => baseModel(mo) === bm).reduce((a, [mo, u]) => a + sumU(mo, u), 0)),
    }));
  } else {
    datasets = types.map(t => ({
      label: t.label, backgroundColor: css(t.color),
      data: range.map(day => entries(day).reduce((a, [mo, u]) => a + valT(mo, u, t), 0)),
    }));
  }
  datasets.forEach(ds => Object.assign(ds, { stack: 's', borderRadius: 2, maxBarThickness: 48 }));

  const grandTok = tokTotals.reduce((a, b) => a + b, 0), grandEur = eurTotals.reduce((a, b) => a + b, 0);
  const active = tokTotals.filter(t => t > 0).length;
  const unpriced = unpricedModels(Object.assign({}, ...Object.values(days).map(d => d)));
  $('daysMeta').innerHTML = `
    <span>Periodo: <b>${esc(periodLabel(range[0]))}</b> → <b>${esc(periodLabel(range[range.length - 1]))}</b></span>
    <span>${daily ? 'Días' : 'Tramos'} con actividad: <b>${active}</b></span>
    <span>Total tokens${hide ? ' (sin lectura de caché)' : ''}: <b>${fmt(grandTok)}</b></span>
    <span>Coste estimado: <b class="money">${fmtEur(grandEur)}</b></span>
    <span>Media por ${daily ? 'día' : 'tramo'} activo: <b>${fmt(Math.round(grandTok / Math.max(active, 1)))}</b> · <b class="money">${fmtEur(grandEur / Math.max(active, 1))}</b></span>
    <span>Sesiones: <b>${matchedSessions}</b></span>
    ${estimatedNote(unpriced)}`;

  const label = key => {
    const date = `${key.slice(8, 10)}/${key.slice(5, 7)}`;
    return daily ? date : [date, blockTime(key)];
  };
  const totalsPlugin = {
    id: 'dayTotals',
    afterDatasetsDraw(c) {
      const slot = c.scales.x.width / range.length - 4;   // hueco por dia
      if (slot < 10) return;                               // demasiados dias: no cabe ni en vertical
      const { ctx } = c, metas = c.data.datasets.map((_, i) => c.getDatasetMeta(i)).filter(mm => !mm.hidden);
      ctx.save(); ctx.font = `600 ${slot < 40 ? 10 : 11}px system-ui, sans-serif`; ctx.textAlign = 'center';
      range.forEach((_, i) => {
        if (!tokTotals[i]) return;
        const els = metas.map(mm => mm.data[i]).filter(Boolean);
        if (els.length) drawBarLabel(ctx, els[0].x, Math.min(...els.map(e => e.y)), tokTotals[i], fmtEur(eurTotals[i]), null, slot);
      });
      ctx.restore();
    },
  };

  // Hueco aproximado por dia antes de dibujar (el exacto lo calcula el plugin con la escala real)
  const daySlot = () => ($('dayChart').parentElement.clientWidth - 70) / range.length - 4;

  const bands = showBands ? dayNightSegments(range, span) : [];
  const dayNightPlugin = {
    id: 'dayNightBands',
    beforeDraw(c) {
      if (!bands.length || !c.chartArea) return;
      const { ctx, chartArea: { left, right, top, bottom } } = c;
      const slot = (right - left) / range.length;
      ctx.save();
      ctx.beginPath(); ctx.rect(left, top, right - left, bottom - top); ctx.clip();
      ctx.font = '14px system-ui, sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'top';
      for (const band of bands) {
        const x = left + band.start * slot, width = (band.end - band.start) * slot;
        ctx.fillStyle = band.day ? 'rgba(73, 155, 222, .18)' : 'rgba(62, 72, 135, .26)';
        ctx.fillRect(x, top, width, bottom - top);
        if (width >= 40) {
          ctx.fillStyle = band.day ? '#f2cd73' : '#c0c9f4';
          ctx.fillText(band.day ? '☀' : '☾  ✦', x + width / 2, top + 8);
        }
      }
      ctx.restore();
    },
  };

  if (dayChart) dayChart.destroy();
  dayChart = new Chart($('dayChart'), {
    type: 'bar',
    data: { labels: range.map(label), datasets },
    plugins: [dayNightPlugin, totalsPlugin],
    options: {
      maintainAspectRatio: false,
      layout: { padding: { top: 38 } },
      interaction: { mode: 'index', intersect: false },
      scales: {
        x: { stacked: true, grid: { display: false }, ticks: { color: css('--muted'), maxRotation: 60, autoSkip: true } },
        y: { stacked: true, grace: daySlot() < VERTICAL_SLOT ? '28%' : 0,   // en vertical la etiqueta necesita hueco sobre la barra
             grid: { color: css('--border') }, ticks: { color: css('--muted'), callback: v => axisV(v) } },
      },
      plugins: {
        legend: { labels: { color: css('--text') } },
        tooltip: {
          filter: it => it.raw > 0 || totals[it.dataIndex] === 0,
          callbacks: {
            title: items => {
              if (!items.length) return '';
              const key = range[items[0].dataIndex];
              const date = new Date(key.slice(0, 10) + 'T00:00').toLocaleDateString('es-ES',
                { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
              return daily ? date : `${date} · ${blockTime(key)} (hora local)`;
            },
            label: it => `${it.dataset.label}: ${fmtV(it.raw)}`,
            footer: items => items.length ? [`Total: ${fmt(tokTotals[items[0].dataIndex])} tokens`,
                              `Coste estimado: ${fmtEur(eurTotals[items[0].dataIndex])}`] : [],
          },
        },
      },
    },
  });
}

function render() {
  if (!current || tab !== 'session') return;
  const { s, main, agents } = current;
  const hide = $('hideCacheRead').checked;
  const types = TYPES.filter(t => !(hide && t.key === 'cache_read_input_tokens'));
  const bars = [
    { label: 'Sesión principal', full: s.title || 'Sesión principal', kind: 'principal', isMain: true, ...main },
    ...agents.map(a => ({ label: trunc(a.description, 42), full: a.description,
      kind: a.agentType + (a.depth > 1 ? ` (nivel ${a.depth})` : ''), ...a })),
  ];
  const sumAll = bars.reduce((a, b) => a + b.total, 0);
  const typeKeys = types.map(t => t.key);
  bars.forEach(b => { b.cost = costOf(b.models); b.shownCost = costOf(b.models, typeKeys); });
  const costAll = bars.reduce((a, b) => a + b.cost, 0);
  const unpriced = unpricedModels(Object.assign({}, ...bars.map(b => b.models)));
  const nSub = agents.filter(a => !a.review).length, nRev = agents.length - nSub;

  $('meta').innerHTML = `
    <span>Sesión: <b>${esc(s.title)}</b></span>
    <span>Proyecto: <b title="${esc(s.cwd)}">${esc(prettyProject(s))}</b></span>
    <span>Inicio: <b>${esc(fmtDate(main.start))}</b></span>
    <span>Fin: <b>${esc(fmtDate(main.end))}</b></span>
    <span>Subagentes: <b>${nSub}</b></span>
    <span>Revisiones: <b>${nRev}</b></span>
    <span>Total tokens (principal + agentes): <b>${fmt(sumAll)}</b></span>
    <span>Coste estimado: <b class="money">${money(costAll)}</b></span>
    ${estimatedNote(unpriced)}
    <span>Id: <b>${esc(s.id)}</b></span>`;

  const datasets = types.map(t => ({
    label: t.label, backgroundColor: css(t.color), stack: 's', borderRadius: 2,
    maxBarThickness: BAR_W, categoryPercentage: 0.8, barPercentage: 0.9,
    data: bars.map(b => b.tokens[t.key]),
  }));

  // Las barras tienen un ancho fijo y empiezan por la izquierda: se reservan "huecos" vacios
  // (etiquetas '') hasta rellenar el ancho del grafico.
  const slots = Math.max(bars.length, Math.floor($('chart').parentElement.clientWidth / SLOT_W));
  const labels = bars.map(b => b.label).concat(Array(slots - bars.length).fill(''));

  const totalsPlugin = {
    id: 'totals',
    afterDatasetsDraw(c) {
      const { ctx } = c;
      const metas = c.data.datasets.map((_, i) => c.getDatasetMeta(i)).filter(m => !m.hidden);
      ctx.save();
      ctx.font = '600 11px system-ui, sans-serif';
      ctx.textAlign = 'center';
      bars.forEach((b, i) => {
        const tops = metas.map(m => m.data[i]).filter(Boolean);
        if (!tops.length) return;
        const y = Math.min(...tops.map(el => el.y));
        const x = tops[0].x;
        const shown = types.reduce((a, t) => a + b.tokens[t.key], 0);
        const color = b.isMain ? css('--c-main') : b.review ? css('--c-review') : css('--c-agent');
        drawBarLabel(ctx, x, y, shown, money(b.shownCost), color);
      });
      ctx.restore();
    },
  };

  if (chart) chart.destroy();
  chart = new Chart($('chart'), {
    type: 'bar',
    data: { labels, datasets },
    plugins: [totalsPlugin],
    options: {
      maintainAspectRatio: false,
      layout: { padding: { top: 44 } },
      scales: {
        x: { stacked: true, grid: { display: false },
             ticks: { color: css('--muted'), maxRotation: 45, minRotation: 45, autoSkip: false } },
        y: { stacked: true, grid: { color: css('--border') },
             ticks: { color: css('--muted'), callback: v => short(v) } },
      },
      plugins: {
        legend: { labels: { color: css('--text') } },
        tooltip: {
          callbacks: {
            title: items => bars[items[0].dataIndex]?.full || '',
            label: it => `${it.dataset.label}: ${fmt(it.raw)}`,
            afterBody: items => {
              const b = bars[items[0].dataIndex];
              if (!b) return [];
              return [`Tipo: ${b.kind}`, `Modelo: ${modelsText(b.models)}`,
                      `Peticiones: ${b.requests}`, `Total: ${fmt(b.total)}`,
                      `Coste estimado: ${money(b.cost)}`];
            },
          },
        },
      },
    },
  });

  const head = TYPES.map(t => `<th><span class="swatch" style="background:${css(t.color)}"></span>${t.label}</th>`).join('');
  $('detail').innerHTML = `<table>
    <thead><tr><th>Barra</th><th>Tipo</th><th>Modelo</th>${head}<th>Total</th><th>Coste est.</th><th>Peticiones</th></tr></thead>
    <tbody>${bars.map((b, i) => `<tr class="${i ? '' : 'main'}">
      <td class="desc" title="${esc(b.full)}">${esc(b.full)}</td><td>${esc(b.kind)}</td><td>${esc(modelsText(b.models))}</td>
      ${TYPES.map(t => `<td>${fmt(b.tokens[t.key])}</td>`).join('')}
      <td><b>${fmt(b.total)}</b></td><td><b class="money">${money(b.cost)}</b></td><td>${b.requests}</td></tr>`).join('')}</tbody></table>`;
}

document.querySelectorAll('.tabs button').forEach(b => b.addEventListener('click', () => {
  setTab(b.dataset.tab);
  history.replaceState(null, '', b.dataset.tab === 'days' ? '#days' : location.pathname);
}));
if (location.hash === '#days') setTab('days');   // la pestana se puede abrir o guardar con la URL
$('groupBy').addEventListener('change', renderDays);
$('granularity').addEventListener('change', renderDays);
$('dateFrom').addEventListener('change', renderDays);
$('dateTo').addEventListener('change', renderDays);
$('showDayNight').addEventListener('change', renderDays);
$('metric').addEventListener('change', renderDays);
$('project').addEventListener('change', () => { fillSessions(); renderDays(); });
$('session').addEventListener('change', showSession);
$('hideCacheRead').addEventListener('change', () => { render(); renderDays(); });
$('reload').addEventListener('click', () => init().catch(showError));
window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { render(); renderDays(); });
let lastW = 0, resizeTimer;
window.addEventListener('resize', () => {   // recalcula los huecos de barras al cambiar el ancho
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => {
    const w = $('chart').parentElement.clientWidth;
    if (Math.abs(w - lastW) > SLOT_W / 2) { lastW = w; render(); }
  }, 200);
});
function showError(e) { $('meta').innerHTML = `<span class="empty">Error: ${esc(e.message)}</span>`; }
setDefaultDateRange();
init().catch(showError);
</script>
</body>
</html>
